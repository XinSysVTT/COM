<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lid" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7d99b8"/>
      <stop offset="55%" stop-color="#4f6c8c"/>
      <stop offset="100%" stop-color="#28394e"/>
    </radialGradient>
    <radialGradient id="rim" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3a5471"/>
      <stop offset="100%" stop-color="#1a2634"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="53" cy="55" rx="46" ry="44" fill="url(#shadow)"/>

  <!-- drum body edge -->
  <circle cx="50" cy="51" r="41" fill="url(#rim)" stroke="#101823" stroke-width="3"/>
  <!-- rolled chime ring -->
  <circle cx="50" cy="51" r="35" fill="none" stroke="#1a2634" stroke-width="6"/>
  <!-- lid -->
  <circle cx="50" cy="51" r="31" fill="url(#lid)" stroke="#101823" stroke-width="2.5"/>
  <!-- rolling hoop grooves on the skirt -->
  <circle cx="50" cy="51" r="41" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="50" cy="51" r="38.5" fill="none" stroke="#7d99b8" stroke-opacity="0.28" stroke-width="1.6"/>

  <!-- wear streaks -->
  <path d="M30 34q4 6 2 12M68 66q-3 5-1 10" stroke="#1c2a3a" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- water drop stencil -->
  <path d="M50 39c7 8 10 12 10 17a10 10 0 0 1-20 0c0-5 3-9 10-17z" fill="#bfe3f5" opacity="0.9" stroke="#28425c" stroke-width="2"/>
  <path d="M46 56a5 5 0 0 0 5 4" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- bungs -->
  <circle cx="36" cy="64" r="4.5" fill="#1c2a3a" stroke="#101823" stroke-width="2"/>
  <circle cx="36" cy="64" r="2.5" fill="#0e1620"/>
  <circle cx="64" cy="38" r="3.5" fill="#1c2a3a" stroke="#101823" stroke-width="2"/>
  <circle cx="64" cy="38" r="2" fill="#0e1620"/>

  <!-- rim light -->
  <path d="M22 34a33 33 0 0 1 24-14" stroke="#a9c6dd" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
