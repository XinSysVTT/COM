<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lid" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#c05c3a"/>
      <stop offset="55%" stop-color="#96381f"/>
      <stop offset="100%" stop-color="#5c1e0e"/>
    </radialGradient>
    <radialGradient id="rim" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#7e2c15"/>
      <stop offset="100%" stop-color="#431107"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="53" cy="55" rx="46" ry="44" fill="url(#shadow)"/>

  <!-- drum body edge -->
  <circle cx="50" cy="51" r="41" fill="url(#rim)" stroke="#2b0c04" stroke-width="3"/>
  <!-- rolled chime ring -->
  <circle cx="50" cy="51" r="35" fill="none" stroke="#431107" stroke-width="6"/>
  <!-- lid -->
  <circle cx="50" cy="51" r="31" fill="url(#lid)" stroke="#2b0c04" stroke-width="2.5"/>
  <!-- rolling hoop grooves on the skirt -->
  <circle cx="50" cy="51" r="41" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="50" cy="51" r="38.5" fill="none" stroke="#e0704c" stroke-opacity="0.28" stroke-width="1.6"/>

  <!-- rust streaks -->
  <path d="M30 34q4 6 2 12M68 66q-3 5-1 10" stroke="#5c1e0e" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- hazard diamond, faded paint -->
  <rect x="41" y="42" width="18" height="18" rx="2.5" transform="rotate(45 50 51)" fill="none" stroke="#f0c040" stroke-width="2.5" opacity="0.75"/>
  <path d="M50 45.5l3 5.5h-1.6l1 2.6-4.4-3h1.7l-1.2-2z" fill="#f0c040" opacity="0.85"/>

  <!-- bungs -->
  <circle cx="38" cy="63" r="5" fill="#3f1308" stroke="#2b0c04" stroke-width="2"/>
  <circle cx="38" cy="63" r="3" fill="#241008"/>
  <circle cx="63" cy="39" r="3.5" fill="#3f1308" stroke="#2b0c04" stroke-width="2"/>
  <circle cx="63" cy="39" r="2" fill="#241008"/>

  <!-- rim light -->
  <path d="M22 34a33 33 0 0 1 24-14" stroke="#e08a64" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
