<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#478473"/>
      <stop offset="55%" stop-color="#33695c"/>
      <stop offset="100%" stop-color="#1e4038"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8adb2"/>
      <stop offset="55%" stop-color="#6e747a"/>
      <stop offset="100%" stop-color="#41464b"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="103" cy="55" rx="96" ry="44" fill="url(#shadow)"/>

  <!-- roof -->
  <rect x="5" y="8" width="190" height="84" rx="5" fill="url(#roof)" stroke="#102620" stroke-width="3"/>
  <!-- corrugation ridges: alternating shadow groove + highlight crest -->
  <g stroke-width="3">
    <path d="M14 10v80M26 10v80M38 10v80M50 10v80M62 10v80M74 10v80M86 10v80M98 10v80M110 10v80M122 10v80M134 10v80M146 10v80M158 10v80M170 10v80M182 10v80"
          stroke="#173730" stroke-opacity="0.85"/>
    <path d="M9 10v80M21 10v80M33 10v80M45 10v80M57 10v80M69 10v80M81 10v80M93 10v80M105 10v80M117 10v80M129 10v80M141 10v80M153 10v80M165 10v80M177 10v80M189 10v80"
          stroke="#5f9d8c" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <!-- roof center wear -->
  <path d="M12 32h176M12 68h176" stroke="#102620" stroke-opacity="0.35" stroke-width="2"/>

  <!-- door end (right): split doors + lock rods -->
  <path d="M160 10v80" stroke="#102620" stroke-width="3"/>
  <rect x="161" y="10" width="34" height="80" fill="#2c574c" stroke="#102620" stroke-width="2"/>
  <path d="M178 10v80" stroke="#102620" stroke-width="2.5"/>
  <g fill="url(#rod)" stroke="#102620" stroke-width="1.5">
    <rect x="164" y="14" width="4" height="72" rx="2"/>
    <rect x="173" y="14" width="4" height="72" rx="2"/>
    <rect x="183" y="14" width="4" height="72" rx="2"/>
    <rect x="188" y="14" width="4" height="72" rx="2" transform="translate(-2 0)"/>
  </g>
  <!-- handle cams -->
  <rect x="171" y="42" width="8" height="16" rx="2" fill="#8a8f94" stroke="#102620" stroke-width="1.5"/>

  <!-- corner castings -->
  <g fill="#1a332c" stroke="#0c1d18" stroke-width="1.5">
    <rect x="7" y="10" width="9" height="9" rx="1.5"/>
    <rect x="7" y="81" width="9" height="9" rx="1.5"/>
    <rect x="152" y="10" width="9" height="9" rx="1.5"/>
    <rect x="152" y="81" width="9" height="9" rx="1.5"/>
    <rect x="184" y="10" width="9" height="9" rx="1.5"/>
    <rect x="184" y="81" width="9" height="9" rx="1.5"/>
  </g>

  <!-- rust streaks -->
  <path d="M40 12q3 10 1 18M96 88q-2-9 0-16M140 12q2 8 0 14" stroke="#7e4a24" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- rim light -->
  <path d="M10 8h150" stroke="#7fb8a8" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M8 12v74" stroke="#7fb8a8" stroke-opacity="0.35" stroke-width="2"/>
</svg>
