<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helm" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#8fa3a0"/>
      <stop offset="48%" stop-color="#566966"/>
      <stop offset="100%" stop-color="#293634"/>
    </radialGradient>
    <radialGradient id="pad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#6f8581"/>
      <stop offset="55%" stop-color="#3f504d"/>
      <stop offset="100%" stop-color="#20292a"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#54696a"/>
      <stop offset="55%" stop-color="#374848"/>
      <stop offset="100%" stop-color="#1f2a2a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b6b66"/>
      <stop offset="55%" stop-color="#2e423f"/>
      <stop offset="100%" stop-color="#18211f"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9fff0"/>
      <stop offset="55%" stop-color="#63d6b4"/>
      <stop offset="100%" stop-color="#2c8a70"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#15181d"/>
    </linearGradient>
  </defs>

  <ellipse cx="103" cy="118" rx="72" ry="54" fill="url(#shadow)"/>

  <!-- heavy backpack with canisters -->
  <rect x="72" y="122" width="56" height="38" rx="11" fill="#1c2626" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <rect x="80" y="128" width="12" height="22" rx="4" fill="#46a08d" opacity="0.55"/>
  <rect x="96" y="128" width="12" height="22" rx="4" fill="#141b1b"/>
  <rect x="112" y="128" width="12" height="22" rx="4" fill="#46a08d" opacity="0.55"/>

  <!-- broad torso -->
  <ellipse cx="100" cy="108" rx="58" ry="41" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <ellipse cx="100" cy="108" rx="42" ry="29" fill="none" stroke="#141c1c" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M100 70v76" stroke="#141c1c" stroke-opacity="0.5" stroke-width="2.5"/>
  <path d="M78 96h44" stroke="#141c1c" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M60 98l28 46M140 98l-28 46" stroke="#182122" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <!-- medic cross on back plate -->
  <path d="M100 126v16M92 134h16" stroke="#46a08d" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- pauldrons -->
  <circle cx="50" cy="104" r="25" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="150" cy="104" r="25" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M36 92a23 23 0 0 1 16-9" stroke="#b9cfc9" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M136 92a23 23 0 0 1 16-9" stroke="#b9cfc9" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M38 114h23M139 114h23" stroke="#46a08d" stroke-width="4" opacity="0.9"/>

  <!-- right arm with carbine aimed down-right -->
  <rect x="128" y="60" width="17" height="46" rx="8.5" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2" transform="rotate(-16 136 83)"/>
  <!-- carbine -->
  <g transform="translate(126 92) rotate(48)">
    <rect x="-14" y="-6" width="52" height="12" rx="3" fill="url(#gun)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="36" y="-2.5" width="24" height="5" rx="2" fill="#20252b"/>
    <rect x="58" y="-3.5" width="7" height="7" rx="1.5" fill="#111418"/>
    <rect x="-6" y="6" width="9" height="13" rx="2.5" fill="#20252b"/>
  </g>
  <circle cx="138" cy="80" r="7.5" fill="#151b1b" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>

  <!-- left arm behind tower shield -->
  <!-- shield, held along the left side -->
  <g transform="rotate(8 56 110)">
    <rect x="24" y="62" width="40" height="104" rx="16" fill="url(#shield)" stroke="#0b0e13" stroke-opacity="0.6" stroke-width="3"/>
    <rect x="31" y="70" width="26" height="88" rx="11" fill="none" stroke="#46a08d" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M44 92v40M30 112h28" stroke="#46a08d" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="36" cy="76" rx="7" ry="14" fill="#ffffff" opacity="0.14"/>
  </g>
  <!-- left hand gripping shield strap, peeking north of shield -->
  <circle cx="64" cy="62" r="7.5" fill="#151b1b" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>

  <!-- helmet -->
  <circle cx="100" cy="80" r="28" fill="url(#helm)" stroke="#0b0e13" stroke-opacity="0.6" stroke-width="2.5"/>
  <path d="M74 96a28 28 0 0 0 52 0" stroke="#0b0e13" stroke-opacity="0.3" stroke-width="6" fill="none"/>
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="url(#visor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="#86e6c9" opacity="0.2"/>
  <!-- headset earpiece -->
  <circle cx="72" cy="82" r="6" fill="#1c2626" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="72" cy="82" r="2.2" fill="#46a08d"/>
  <ellipse cx="88" cy="70" rx="9" ry="5" fill="#ffffff" opacity="0.26" transform="rotate(-24 88 70)"/>
  <path d="M78 56a26 26 0 0 1 20-5" stroke="#cfe4df" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
