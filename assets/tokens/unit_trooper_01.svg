<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helm" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#96a6b7"/>
      <stop offset="48%" stop-color="#5b6a7a"/>
      <stop offset="100%" stop-color="#2b333e"/>
    </radialGradient>
    <radialGradient id="pad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7e8e9f"/>
      <stop offset="55%" stop-color="#454f5b"/>
      <stop offset="100%" stop-color="#232a33"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5f6e7f"/>
      <stop offset="55%" stop-color="#3d4753"/>
      <stop offset="100%" stop-color="#232a33"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8f1ff"/>
      <stop offset="55%" stop-color="#5fc4e8"/>
      <stop offset="100%" stop-color="#2f7fa8"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#15181d"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="103" cy="116" rx="68" ry="52" fill="url(#shadow)"/>

  <!-- backpack, peeking out behind (south) -->
  <rect x="74" y="120" width="52" height="38" rx="11" fill="#1d232c" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <rect x="82" y="128" width="14" height="20" rx="4" fill="#151a21"/>
  <rect x="104" y="128" width="14" height="20" rx="4" fill="#151a21"/>

  <!-- torso / back plate -->
  <ellipse cx="100" cy="106" rx="53" ry="39" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- back plate detail -->
  <ellipse cx="100" cy="106" rx="38" ry="27" fill="none" stroke="#161b22" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M100 68v76" stroke="#161b22" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M74 92l12 10M126 92l-12 10" stroke="#161b22" stroke-opacity="0.5" stroke-width="2"/>
  <!-- straps -->
  <path d="M62 96l28 44M138 96l-28 44" stroke="#1a2029" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <!-- friendly accent chevrons -->
  <path d="M84 134l8-6 8 6M92 142l8-6 8 6" stroke="#3f7fbf" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- pauldrons -->
  <circle cx="52" cy="102" r="24" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="148" cy="102" r="24" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M38 90a22 22 0 0 1 16-9" stroke="#aebfd0" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M134 90a22 22 0 0 1 16-9" stroke="#aebfd0" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M40 112h22M138 112h22" stroke="#3f7fbf" stroke-width="4" opacity="0.9"/>

  <!-- arms reaching forward -->
  <rect x="52" y="58" width="16" height="46" rx="8" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2" transform="rotate(24 60 81)"/>
  <rect x="128" y="58" width="16" height="46" rx="8" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2" transform="rotate(-24 136 81)"/>

  <!-- rifle, aimed up-right -->
  <g transform="translate(120 74) rotate(28) scale(1.12)">
    <rect x="-50" y="-4.5" width="17" height="9" rx="2" fill="url(#gun)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="-36" y="-6.5" width="66" height="13" rx="3" fill="url(#gun)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="28" y="-2.5" width="28" height="5" rx="2" fill="#20252b"/>
    <rect x="54" y="-3.5" width="7" height="7" rx="1.5" fill="#111418"/>
    <rect x="-16" y="-11.5" width="16" height="5" rx="2" fill="#20252b"/>
    <rect x="-4" y="6.5" width="9" height="14" rx="2.5" fill="#20252b" transform="rotate(5 0 13)"/>
  </g>

  <!-- gloves over the rifle -->
  <circle cx="100" cy="64" r="7.5" fill="#161a20" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="134" cy="70" r="7.5" fill="#161a20" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>

  <!-- helmet (facing up) -->
  <circle cx="100" cy="80" r="28" fill="url(#helm)" stroke="#0b0e13" stroke-opacity="0.6" stroke-width="2.5"/>
  <!-- helmet shadow cast on body -->
  <path d="M74 96a28 28 0 0 0 52 0" stroke="#0b0e13" stroke-opacity="0.3" stroke-width="6" fill="none"/>
  <!-- visor slit -->
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="url(#visor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="#7fd8ff" opacity="0.22"/>
  <!-- helmet crest -->
  <path d="M100 54v-8" stroke="#3f7fbf" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- specular highlights -->
  <ellipse cx="88" cy="70" rx="9" ry="5" fill="#ffffff" opacity="0.28" transform="rotate(-24 88 70)"/>
  <path d="M78 56a26 26 0 0 1 20-5" stroke="#c3d2e0" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
