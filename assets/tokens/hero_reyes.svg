<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helm" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#a5a296"/>
      <stop offset="48%" stop-color="#6d6a5e"/>
      <stop offset="100%" stop-color="#33312a"/>
    </radialGradient>
    <radialGradient id="pad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#8d8a7c"/>
      <stop offset="55%" stop-color="#565347"/>
      <stop offset="100%" stop-color="#2b2922"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#78766a"/>
      <stop offset="55%" stop-color="#4e4c42"/>
      <stop offset="100%" stop-color="#2c2b25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="55%" stop-color="#b28c3e"/>
      <stop offset="100%" stop-color="#6e5423"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#8a3030"/>
      <stop offset="100%" stop-color="#451515"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe9bd"/>
      <stop offset="55%" stop-color="#f0b45c"/>
      <stop offset="100%" stop-color="#a86e24"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#15181d"/>
    </linearGradient>
  </defs>

  <ellipse cx="103" cy="116" rx="70" ry="54" fill="url(#shadow)"/>

  <!-- half-cape flowing south-east -->
  <path d="M116 120q34 6 46 34 8 20-2 30-16-6-24-20l-30-26z" fill="url(#cape)" stroke="#160808" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 132q20 8 28 24" stroke="#160808" stroke-opacity="0.35" stroke-width="2" fill="none"/>

  <!-- backpack -->
  <rect x="76" y="122" width="48" height="34" rx="10" fill="#23211b" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- antenna -->
  <path d="M120 128l10-22" stroke="#0b0e13" stroke-width="3" stroke-linecap="round"/>
  <circle cx="131" cy="104" r="3.5" fill="#f0b45c"/>

  <!-- torso -->
  <ellipse cx="100" cy="106" rx="54" ry="40" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <ellipse cx="100" cy="106" rx="39" ry="28" fill="none" stroke="#17150f" stroke-opacity="0.65" stroke-width="2"/>
  <path d="M100 68v76" stroke="#17150f" stroke-opacity="0.5" stroke-width="2.5"/>
  <!-- gold trim collar -->
  <path d="M72 90a34 34 0 0 1 56 0" stroke="url(#gold)" stroke-width="5" fill="none"/>
  <path d="M62 96l28 44M138 96l-28 44" stroke="#1c1912" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <!-- commander badge -->
  <circle cx="100" cy="134" r="6" fill="url(#gold)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>

  <!-- oversized pauldrons -->
  <circle cx="48" cy="100" r="27" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="152" cy="100" r="27" fill="url(#pad)" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M33 87a25 25 0 0 1 17-10" stroke="#d7d4c4" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M137 87a25 25 0 0 1 17-10" stroke="#d7d4c4" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M36 111h24M140 111h24" stroke="url(#gold)" stroke-width="4.5"/>

  <!-- arms -->
  <rect x="50" y="56" width="17" height="48" rx="8.5" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2" transform="rotate(24 58 80)"/>
  <rect x="127" y="56" width="17" height="48" rx="8.5" fill="url(#armor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2" transform="rotate(-24 135 80)"/>

  <!-- ornate pistol, aimed up-right -->
  <g transform="translate(114 68) rotate(26)">
    <rect x="-26" y="-6" width="46" height="12" rx="3" fill="url(#gun)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="20" y="-2.5" width="22" height="5" rx="2" fill="#20252b"/>
    <rect x="-10" y="-10" width="12" height="5" rx="2" fill="url(#gold)"/>
    <rect x="4" y="6" width="9" height="14" rx="2.5" fill="#20252b" transform="rotate(8 8 13)"/>
    <path d="M-20 0h30" stroke="#5b6068" stroke-width="2" opacity="0.8"/>
  </g>

  <circle cx="96" cy="60" r="7.5" fill="#1a1812" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="128" cy="64" r="7.5" fill="#1a1812" stroke="#0b0e13" stroke-opacity="0.55" stroke-width="2"/>

  <!-- helmet with gold crest -->
  <circle cx="100" cy="80" r="28" fill="url(#helm)" stroke="#0b0e13" stroke-opacity="0.6" stroke-width="2.5"/>
  <path d="M74 96a28 28 0 0 0 52 0" stroke="#0b0e13" stroke-opacity="0.3" stroke-width="6" fill="none"/>
  <path d="M100 50c4 8 4 14 0 20-4-6-4-12 0-20z" fill="url(#gold)" stroke="#0b0e13" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="url(#visor)" stroke="#0b0e13" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="80" y="60" width="40" height="13" rx="6.5" fill="#ffcf7f" opacity="0.2"/>
  <ellipse cx="88" cy="70" rx="9" ry="5" fill="#ffffff" opacity="0.26" transform="rotate(-24 88 70)"/>
  <path d="M78 56a26 26 0 0 1 20-5" stroke="#e2ddc9" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
